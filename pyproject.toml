[project]
name = "danalyze"
version = "0.1.0"
description = "Terminal UI tool for analyzing disk space usage"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47",
    "pandas>=2.0",
]

[project.scripts]
danalyze = "danalyze.__main__:cli"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
